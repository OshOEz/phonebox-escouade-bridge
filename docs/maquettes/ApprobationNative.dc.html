<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Approbation native PhoneBox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #2dd4bf;outline-offset:2px}
button:active{transform:scale(.96)}
</style>
</helmet>
<div style="width: 900px; height: 420px; box-sizing: border-box; padding: 14px; color: #eef2f6; font-family: Roboto, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: rgba(4, 5, 8, .88) radial-gradient(60% 80% at 78% 30%, rgba(45, 212, 191, .08), transparent 70%); display: flex">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding: 14px 18px; border-radius: 22px; background: #10131a; border: 1px solid rgba(217, 119, 87, .55); box-shadow: 0 0 0 4px rgba(217, 119, 87, .12), 0 20px 60px rgba(0, 0, 0, .6)">
    <div style="display: flex; align-items: center; gap: 7px; font-size: 13px; color: #8a94a3">
      <span style="color: #d97757; font-size: 16px" aria-hidden="true">✳</span><span>Escouade · Claude Code</span><span style="color: #5b6472">·</span>
      <span style="color: #eef2f6; font-size: 13px; font-weight: 650">refacto-auth</span>
      <span style="font: 11.5px/1.3 'Roboto Mono', monospace; color: #8a94a3">~/dev/demo-api</span>
      <span style="margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 8px; background: rgba(255, 255, 255, .08)">1 / 2</span>
    </div>
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -.01em">Bash</div>
    <div style="font-size: 13px; color: #8a94a3">Pousse la branche rebasée</div>
    <pre style="flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 10px 12px; border-radius: 12px; background: #06080b; border: 1px solid rgba(255, 255, 255, .08); font: 12.5px/1.45 'Roboto Mono', monospace; color: #d5dce5; white-space: pre-wrap; word-break: break-word">git push --force-with-lease origin ticket/DEM-4</pre>
    <div style="display: flex; align-items: center; gap: 12px; padding-top: 4px">
      <span style="flex: 1; font-size: 12px; color: #5b6472">{{ footText }}</span>
      <sc-if value="{{ pending }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ deny }}" style="min-width: 150px; padding: 14px 22px; border-radius: 14px; font-size: 17px; font-weight: 700; background: rgba(239, 68, 68, .16); color: #fca5a5; border: 1px solid rgba(239, 68, 68, .4)">Refuser</button>
        <button onClick="{{ allow }}" style="min-width: 150px; padding: 14px 22px; border-radius: 14px; font-size: 17px; font-weight: 700; background: #22c55e; color: #052e14; border: 0">Autoriser</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":420}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { answer: null }; }
  renderVals() {
    var self = this, a = this.state.answer;
    return {
      pending: !a,
      footText: !a ? 'Expire dans 1:24' : a === 'allow' ? '✓ Autorisé. Escouade note : « Autorisé par Claude (hors Escouade) via Escouade »' : '✕ Refusé depuis le téléphone',
      allow: function () { self.setState({ answer: 'allow' }); },
      deny: function () { self.setState({ answer: 'deny' }); }
    };
  }
}
</script>
</body>
</html>
